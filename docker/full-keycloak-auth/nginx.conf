# Ningx configuration, do not hesitate to tune it for your needs (and to propose improvements on this)
worker_processes auto;

events { worker_connections 1024; }

http {

    sendfile on;

    upstream api {
        server api:5000;
    }

    upstream auth {
        server auth:8080;
    }
 
    upstream website {
        server website:3000;
    }

	server {
		listen 80;

		# We need to set X-Forwarded headers, so the API can use them to make nice internal links
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;

		# Limit the files that can be sent to 100M
		client_max_body_size  100M;

		# buffer size when receiving big files. 6M should be enough for most pictures, but feel free to tune this value depending of your needs.
		client_body_buffer_size 6M;

		client_body_timeout	120s;
		send_timeout		60s;
		proxy_read_timeout	120s;
		proxy_send_timeout	120s;

		# Security response headers, applied only to the app-facing routes (/api and
		# the website below). Deliberately NOT on /oauth — Keycloak sends and manages
		# its own security/CSP headers there, and a second Referrer-Policy here would
		# override its stricter one. No X-Frame-Options/frame-ancestors anywhere: the
		# Panoramax viewer is meant to stay embeddable in third-party pages. HSTS is a
		# plain max-age (TLS is terminated upstream at Traefik/Coolify); add
		# includeSubDomains/preload only if you own every subdomain of this host.
		# nginx only inherits add_header into a location that sets none of its own, so
		# these three lines are repeated in each app location rather than hoisted.

		# Note: you might want to add some cache on some heavily used routes, likes high level zoom on /api/map
		location /api {
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "strict-origin-when-cross-origin" always;
			add_header Strict-Transport-Security "max-age=31536000" always;

			proxy_pass http://api;
			proxy_redirect default;
		}

		location /oauth {
			proxy_pass http://auth;

            proxy_buffer_size 16k;
            proxy_busy_buffers_size 24k;
            proxy_buffers 64 4k;

            # add X-forward- headers for keycloak to know it's canonical host
            # force https
    	    proxy_set_header X-Forwarded-Proto https;
            # pass real hostname so Keycloak generates correct asset URLs and CSP headers
            proxy_set_header Host $host;
            # Strip RFC 7239 Forwarded header from upstream proxies (e.g. Traefik/Coolify).
            # It omits the port field and Keycloak 26.x fails to parse it. KC uses X-Forwarded-* instead.
            proxy_set_header Forwarded "";

			proxy_redirect default;
		}

		location / {
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "strict-origin-when-cross-origin" always;
			add_header Strict-Transport-Security "max-age=31536000" always;

			proxy_pass http://website;
			proxy_redirect default;
		}

		location = /robots.txt {
		alias /etc/nginx/robots.txt;
		default_type text/plain;
		}

		# Optional branding overrides, read from the `branding` volume — see
		# configuration_options.md (Branding) for the filenames and how to drop
		# files in. The upstream website image bakes its logo/favicon/social image
		# in at build time, so the only way to replace them without forking and
		# rebuilding it is to intercept the requests here.
		#
		# Each block falls through to @website when its file is absent, so an empty
		# volume behaves exactly like a stock deployment and every asset can be
		# overridden on its own. Every block must declare its own default_type:
		# this nginx.conf does not `include mime.types` (same reason the
		# /robots.txt block above sets it), so a local file would otherwise be
		# served as text/plain.

		# The logo is imported through JS, so Vite content-hashes it into
		# /assets/logo-<hash>.png and the hash changes with every website release.
		# Match it by pattern rather than by name. Regex locations take precedence
		# over the `location /` prefix match above, so no reordering is needed.
		location ~ ^/assets/logo-[^/]+\.png$ {
			add_header X-Content-Type-Options "nosniff" always;
			add_header Cache-Control "public, max-age=3600" always;
			root /etc/nginx;
			default_type image/png;
			try_files /branding/logo.png @website;
		}

		# Small logo variant, hashed the same way.
		location ~ ^/assets/logo_100-[^/]+\.png$ {
			add_header X-Content-Type-Options "nosniff" always;
			add_header Cache-Control "public, max-age=3600" always;
			root /etc/nginx;
			default_type image/png;
			try_files /branding/logo-small.png @website;
		}

		location = /panoramax_favicon.svg {
			add_header X-Content-Type-Options "nosniff" always;
			add_header Cache-Control "public, max-age=3600" always;
			root /etc/nginx;
			default_type image/svg+xml;
			try_files /branding/favicon.svg @website;
		}

		# Referenced by /manifest.json — these are what an installed/home-screen
		# shortcut uses, so replacing only the SVG above leaves the Panoramax mark.
		location = /panoramax_favicon_192.png {
			add_header X-Content-Type-Options "nosniff" always;
			add_header Cache-Control "public, max-age=3600" always;
			root /etc/nginx;
			default_type image/png;
			try_files /branding/favicon-192.png @website;
		}

		location = /panoramax_favicon_512.png {
			add_header X-Content-Type-Options "nosniff" always;
			add_header Cache-Control "public, max-age=3600" always;
			root /etc/nginx;
			default_type image/png;
			try_files /branding/favicon-512.png @website;
		}

		# Open Graph image used for link previews on social platforms.
		location = /meta-img.jpg {
			add_header X-Content-Type-Options "nosniff" always;
			add_header Cache-Control "public, max-age=3600" always;
			root /etc/nginx;
			default_type image/jpeg;
			try_files /branding/meta-img.jpg @website;
		}

		# Fallback target for the branding blocks above: serves the website's own
		# asset when no override file is present.
		location @website {
			proxy_pass http://website;
			proxy_redirect default;
		}

		gzip	on;
		gzip_types	text/plain application/xml image/svg+xml text/css text/javascript text/xml application/json application/javascript;

	}
}



